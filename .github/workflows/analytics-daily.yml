name: Update public site analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *' # 09:20 JST

permissions:
  contents: write

concurrency:
  group: datlume-analytics-daily
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Cloudflare Web Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare_web_analytics.py --days 7 --save public/data/site-analytics.json
      - name: Commit analytics snapshot
        run: |
          if git diff --quiet -- public/data/site-analytics.json; then
            echo "No analytics changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/site-analytics.json
            git commit -m "chore: update public site analytics"
            git push origin HEAD:main
          fi

      # Do not build or deploy the full site here.
      # Generated procurement datasets are intentionally excluded from Git,
      # so a clean GitHub runner does not contain the data required for a
      # complete DATLUME production build. Full deploys run on the collector host.
