name: Collect public market data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *' # 06:15 JST

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect daily procurement sources
        run: python3 collector/run_all.py --source jetro --source jetro_local
      - name: Verify collected data
        run: python3 collector/check_health.py --source jetro --source jetro_local
      - name: Commit updated metadata
        run: |
          if git diff --quiet -- src/data/sources.json; then exit 0; fi
          git config user.name "data-platform-bot"
          git config user.email "data-platform-bot@users.noreply.github.com"
          git add src/data/sources.json
          git commit -m "data: update source metadata"
          git push
